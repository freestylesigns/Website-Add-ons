<style>

ckground:#f4d229}.green{background:#70b874}.red{background:#e1473d;color:#fff}.bluebg{background:#70a9db;color:#fff}.white{background:#fff}.body{padding:18px}.meta,.note{font-size:12px;color:var(--m)}.studio-grid{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:15px}.workspace{min-height:650px;background:#dbe2e8;display:grid;place-items:center;padding:25px;overflow:auto}.board{position:relative;box-shadow:0 15px 35px #0002;flex:none;overflow:hidden}.layer{position:absolute;transform:translate(-50%,-50%);cursor:grab;user-select:none;touch-action:none;z-index:2}.layer:active{cursor:grabbing}.textlayer{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;white-space:nowrap}.gv,.gh{position:absolute;z-index:1;pointer-events:none;border-color:#2e78b7;border-style:dashed;opacity:.75}.gv{top:0;bottom:0;left:50%;border-left-width:1px}.gh{left:0;right:0;top:50%;border-top-width:1px}.swatches{display:grid;grid-template-columns:1fr 1fr;gap:6px}.swatch{border:1px solid var(--l);background:#fff;padding:5px;cursor:pointer;font-size:10px}.dot{height:26px;margin-bottom:4px;border:1px solid #0002}.layers div{padding:8px;border:1px solid var(--l);margin-bottom:5px;cursor:pointer}.layers .sel{border-color:var(--b);background:#eef6fb}footer{background:var(--n);color:#d7e2eb;padding:35px 0}@media(max-width:950px){.studio-grid{grid-template-columns:1fr}.workspace{min-height:520px}.filters,.products,.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.links{display:none}.filters,.products,.grid{grid-template-columns:1fr}}
</style></head><body>

<main id="app"></main><footer><div class="wrap"><strong>Freestyle Sign & Print Company</strong><p>Lightweight marker posts and utility signage for companies around the UK.</p><a href="mailto:sales@freestyle-signs.co.uk">sales@freestyle-signs.co.uk</a></div></footer>
<script>
var P=[
{id:"low",n:"Low Depth Pipeline",network:"BPA",type:"Marker Plates",w:180,h:200,s:"M4 Plate",m:"5mm Polycarbonate",c:"yellow"},
{id:"npg",n:"NPG006",network:"Northern Power Grid",type:"Marker Plates",w:140,h:100,s:"CID Plate Small",m:"Plastic sign",c:"bluebg"},
{id:"poi",n:"Point of Isolation Caution sign",network:"GTC / Northern Power Grid",type:"Site Safety",w:85,h:135,s:"Caution sign",m:"Plastic sign",c:"yellow"},
{id:"ss197",n:"SS197",network:"National Gas Transmission",type:"Site Signage",w:610,h:250,s:"Banner Sign with logo",m:"3mm Aluminium",c:"white"},
{id:"bs",n:"BS10 069",network:"Substation Signs / National Grid",type:"Site Safety",w:400,h:300,s:"Battery charging warning",m:"Plastic sign",c:"yellow"},
{id:"spm4",n:"M4 Marker Post",network:"Scottish Power",type:"Marker Posts",w:1010,h:215,s:"M4 marker post",m:"High Density Polyethylene",c:"white"},
{id:"ngt",n:"NGT Gas Pipeline marker plate",network:"National Gas Transmission",type:"Marker Plates",w:180,h:210,s:"With QR Code, no window",m:"PVC",c:"yellow"},
{id:"danger",n:"Danger of Death Plate",network:"SSE / National Grid / Scottish Power",type:"Site Safety",w:300,h:315,s:"Site warning sign",m:"3mm polycarbonate",c:"yellow"},
{id:"ngn",n:"Gas Pipeline M4 Plate",network:"Northern Gas Networks",type:"Marker Plates",w:180,h:210,s:"Gas Pipeline M4 Plate",m:"Polycarbonate",c:"green"},
{id:"cad",n:"CAD020A",network:"Cadent",type:"Marker Plates",w:180,h:200,s:"IP M4 Plate",m:"Polycarbonate",c:"green"},
{id:"wwe",n:"Shallow Pipeline Marker Plates",network:"Wales & West Utilities",type:"Marker Plates",w:180,h:200,s:"Shallow Pipeline Marker Plates",m:"Polycarbonate",c:"yellow"},
{id:"sgn",n:"CP Cathodic Protection",network:"SGN",type:"Marker Plates",w:200,h:180,s:"Cathodic protection",m:"Polycarbonate",c:"bluebg"}];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(x){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x])})}
function card(x){return '<article class="product"><div class="preview"><div class="sign '+x.c+'">'+esc(x.n)+'</div></div><div class="body"><b>'+esc(x.n)+'</b><div class="meta">'+esc(x.network)+' · '+x.w+' × '+x.h+' mm · '+esc(x.m)+'</div><a class="btn blue" href="#contact">Enquire</a></div></article>'}
function catalogue(){var nets=[],types=[];P.forEach(function(x){if(types.indexOf(x.type)<0)types.push(x.type);x.network.split(" / ").forEach(function(n){if(nets.indexOf(n)<0)nets.push(n)})});app.innerHTML='<section class="section"><div class="wrap"><h2>Signage & Marker Plates</h2><p>Search and sort the representative catalogue by product type, dimensions and network.</p></div></section><section class="catalogue"><div class="wrap"><div class="filters"><input id="q" class="field" placeholder="Search name, network, specification"><select id="t"><option value="">All types</option>'+types.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+'</select><select id="n"><option value="">All networks</option>'+nets.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+'</select><input id="mw" class="field" type="number" placeholder="Min width (mm)"><input id="mh" class="field" type="number" placeholder="Min height (mm)"></div><div id="count" class="meta"></div><div id="products" class="products"></div></div></section>';["q","t","n","mw","mh"].forEach(function(id){document.getElementById(id).oninput=filter});filter()}
function filter(){var q=document.getElementById("q").value.toLowerCase(),t=document.getElementById("t").value,n=document.getElementById("n").value,mw=+document.getElementById("mw").value||0,mh=+document.getElementById("mh").value||0,a=P.filter(function(x){return(!q||JSON.stringify(x).toLowerCase().indexOf(q)>=0)&&(!t||x.type===t)&&(!n||x.network.indexOf(n)>=0)&&x.w>=mw&&x.h>=mh});document.getElementById("count").textContent="Showing "+a.length+" of "+P.length+" representative products";document.getElementById("products").innerHTML=a.map(card).join("")||"<p>No matching products.</p>"}
function studio(){app.innerHTML='<section class="section"><div class="wrap"><h2>Design Studio</h2><p>Create a basic sign specification. The working area remains proportional to the quoted dimensions. Artwork download is intentionally unavailable.</p></div></section><section class="studio"><div class="wrap studio-grid"><aside class="panel"><b>Sign & background</b><p>Width (mm)<input id="sw" class="field" type="number" value="180" min="20"></p><p>Height (mm)<input id="sh" class="field" type="number" value="200" min="20"></p><p><button class="btn blue" id="add">+ Add text</button></p><p><label class="btn">+ Logo / symbol<input id="upload" type="file" accept="image/*" hidden></label></p><b>Pantone background</b><div id="swatches" class="swatches"></div><p class="note">Blue dashed lines are the horizontal and vertical midpoint guides. Drag objects within 6 mm of a midpoint to snap them to it.</p></aside><div class="panel"><b>Working area <span id="read" class="note"></span></b><div class="workspace"><div id="board" class="board"></div></div></div><aside class="panel"><b>Layers & selected object</b><div id="layers" class="layers"></div><hr><div id="props" class="note">Select an object to edit it.</div><p><button class="btn blue" id="enquire">Add design to enquiry</button></p><p class="note">No artwork image or PDF is downloaded.</p></aside></div></section>';init()}
function init(){var s={w:180,h:200,bg:["PMS 109 C","#f9d616"],sel:"t1",layers:[{id:"t1",k:"t",text:"DANGER OF DEATH",x:90,y:65,size:28,wt:800},{id:"t2",k:"t",text:"SITE INFORMATION SIGN",x:90,y:140,size:15,wt:700}]},sw=[["PMS 109 C","#f9d616"],["PMS 186 C","#e52b39"],["PMS 300 C","#0076c8"],["PMS 356 C","#00843d"],["PMS 021 C","#fe5000"],["Cool Gray 1 C","#d9d9d6"],["Black C","#2d2926"],["White","#fff"]];document.getElementById("swatches").innerHTML=sw.map(function(a){return '<button class="swatch" data-c="'+a[0]+'" data-h="'+a[1]+'"><div class="dot" style="background:'+a[1]+'"></div>'+a[0]+"</button>"}).join("");document.querySelectorAll(".swatch").forEach(function(b){b.onclick=function(){s.bg=[b.dataset.c,b.dataset.h];draw()}});document.getElementById("sw").oninput=function(e){s.w=Math.max(20,+e.target.value||180);draw()};document.getElementById("sh").oninput=function(e){s.h=Math.max(20,+e.target.value||200);draw()};document.getElementById("add").onclick=function(){var id="t"+Date.now();s.layers.push({id:id,k:"t",text:"EDITABLE TEXT",x:s.w/2,y:s.h/2,size:18,wt:700});s.sel=id;draw()};document.getElementById("upload").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader;r.onload=function(){var id="i"+Date.now();s.layers.push({id:id,k:"i",name:f.name,src:r.result,x:s.w/2,y:s.h/2,w:90,h:60});s.sel=id;draw()};r.readAsDataURL(f)};document.getElementById("enquire").onclick=function(){var msg=["Design Studio enquiry","Sign dimensions: "+s.w+"mm × "+s.h+"mm","Background: "+s.bg[0],"Default font: Helvetica Neue","Midpoint guides and 6mm snapping enabled","Layers:"];s.layers.forEach(function(l,i){msg.push((i+1)+". "+(l.k==="t"?"Text: "+l.text+" — "+l.size+"pt at "+Math.round(l.x)+"mm / "+Math.round(l.y)+"mm":"Image/logo: "+l.name+" — "+Math.round(l.w)+" × "+Math.round(l.h)+"mm at "+Math.round(l.x)+"mm / "+Math.round(l.y)+"mm"))});contact(msg.join("\n"))};function snap(v,m){return Math.abs(v-m)<=6?m:v}function draw(){var ws=document.querySelector(".workspace"),scale=Math.min((ws.clientWidth-50)/s.w,(ws.clientHeight-50)/s.h),b=document.getElementById("board");b.style.width=Math.round(s.w*scale)+"px";b.style.height=Math.round(s.h*scale)+"px";b.style.background=s.bg[1];document.getElementById("read").textContent=s.w+" × "+s.h+" mm";b.innerHTML='<div class="gv"></div><div class="gh"></div>';s.layers.forEach(function(l){var e=document.createElement(l.k==="i"?"img":"div");e.className="layer "+(l.k==="t"?"textlayer":"");e.dataset.id=l.id;e.style.left=l.x*scale+"px";e.style.top=l.y*scale+"px";if(l.k==="t"){e.textContent=l.text;e.style.fontSize=l.size*.3528*scale+"px";e.style.fontWeight=l.wt}else{e.src=l.src;e.style.width=l.w*scale+"px";e.style.height=l.h*scale+"px";e.style.objectFit="contain";e.draggable=false}if(l.id===s.sel)e.style.outline="1px dashed #2e78b7";e.onpointerdown=start;e.ondblclick=function(){if(l.k==="t"){var v=prompt("Edit text",l.text);if(v!==null){l.text=v;draw()}}};b.appendChild(e)});document.getElementById("layers").innerHTML=s.layers.map(function(l){return '<div class="'+(l.id===s.sel?"sel":"")+'" data-id="'+l.id+'">'+esc(l.k==="t"?l.text:l.name)+'</div>'}).join("");document.querySelectorAll("#layers [data-id]").forEach(function(e){e.onclick=function(){s.sel=e.dataset.id;draw()}});var l=s.layers.find(function(x){return x.id===s.sel});document.getElementById("props").innerHTML=l?(l.k==="t"?'Text<textarea id="pt" class="field">'+esc(l.text)+'</textarea>Text size (pt)<input id="ps" class="field" type="number" value="'+l.size+'">Font: Helvetica Neue<br>X (mm)<input id="px" class="field" type="number" value="'+Math.round(l.x)+'">Y (mm)<input id="py" class="field" type="number" value="'+Math.round(l.y)+'">':'File: '+esc(l.name)+'<br>Width (mm)<input id="iw" class="field" type="number" value="'+Math.round(l.w)+'">Height (mm)<input id="ih" class="field" type="number" value="'+Math.round(l.h)+'">X (mm)<input id="ix" class="field" type="number" value="'+Math.round(l.x)+'">Y (mm)<input id="iy" class="field" type="number" value="'+Math.round(l.y)+'">'):"Select an object to edit it.";bind(l)}function bind(l){if(!l)return;["pt","ps","px","py","iw","ih","ix","iy"].forEach(function(id){var e=document.getElementById(id);if(e)e.oninput=function(){var v=e.value;if(id==="pt")l.text=v;else if(id==="ps")l.size=+v||18;else if(id==="px"||id==="ix")l.x=snap(Math.max(0,Math.min(s.w,+v||0)),s.w/2);else if(id==="py"||id==="iy")l.y=snap(Math.max(0,Math.min(s.h,+v||0)),s.h/2);else if(id==="iw")l.w=Math.max(5,+v||5);else if(id==="ih")l.h=Math.max(5,+v||5);draw()}})}function start(e){e.preventDefault();var l=s.layers.find(function(x){return x.id===e.currentTarget.dataset.id});s.sel=l.id;var sx=e.clientX,sy=e.clientY,ox=l.x,oy=l.y,rect=document.getElementById("board").getBoundingClientRect(),scale=rect.width/s.w;function move(v){l.x=snap(Math.max(0,Math.min(s.w,ox+(v.clientX-sx)/scale)),s.w/2);l.y=snap(Math.max(0,Math.min(s.h,oy+(v.clientY-sy)/scale)),s.h/2);draw()}function up(){document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up)}document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);draw()}draw();window.onresize=draw}
function contact(prefill){app.innerHTML='<section class="section"><div class="wrap"><h2>Product Enquiry</h2><p>Send your enquiry to sales@freestyle-signs.co.uk.</p><form id="f"><input class="field" name="name" required placeholder="Name"><input class="field" name="company" placeholder="Company"><input class="field" name="email" type="email" required placeholder="Email"><input class="field" name="phone" placeholder="Telephone"><textarea class="field" name="message" rows="12" placeholder="Comment or message">'+esc(prefill||"")+'</textarea><button class="btn blue">SEND YOUR ENQUIRY</button><div id="st" class="note"></div></form></div></section>';document.getElementById("f").onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.currentTarget)),body=Object.keys(d).map(function(k){return k+": "+d[k]}).join("\n");location.href="mailto:sales@freestyle-signs.co.uk?subject="+encodeURIComponent("Website enquiry — Marker Plates")+"&body="+encodeURIComponent(body);document.getElementById("st").textContent="Your enquiry has been prepared for email."}}
function home(){app.innerHTML='<section class="hero"><div class="wrap"><h1>Electricity Supply, Gas and Oil Pipeline Marker Plates</h1><p>Supplying lightweight marker plates to utility companies around the UK at competitive prices.</p><a class="btn blue" href="#catalogue">Browse catalogue</a><a class="btn" href="#studio">Open Design Studio</a></div></section><section class="section"><div class="wrap"><h2>A more useful way to find the right sign</h2><div class="grid"><div class="card"><h3>Central catalogue</h3><p>Search by product type, dimensions and network.</p></div><div class="card"><h3>Design Studio</h3><p>Build a proportional mock-up with editable text and draggable symbols.</p></div><div class="card"><h3>Product enquiries</h3><p>Send requirements directly to the configured company sales address.</p></div></div></div></section>'}
function route(){var h=location.hash.slice(1);if(h.indexOf("catalogue")===0)catalogue();else if(h.indexOf("studio")===0)studio();else if(h.indexOf("contact")===0)contact();else home()}onhashchange=route;route();
</script></body></html>
