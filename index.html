function catalogue(){var nets=[],types=[];P.forEach(function(x){if(types.indexOf(x.type)<0)types.push(x.type);x.network.split(" / ").forEach(function(n){if(nets.indexOf(n)<0)nets.push(n)})});app.innerHTML='<section class="section"><div class="wrap"><h2>Signage & Marker Plates</h2><p>Search and sort the representative catalogue by product type, dimensions and network.</p></div></section><section class="catalogue"><div class="wrap"><div class="filters"><input id="q" class="field" placeholder="Search name, network, specification"><select id="t"><option value="">All types</option>'+types.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+'</select><select id="n"><option value="">All networks</option>'+nets.map(function(x){return "<option>"+esc(x)+"</option>"}).join("")+'</select><input id="mw" class="field" type="number" placeholder="Min width (mm)"><input id="mh" class="field" type="number" placeholder="Min height (mm)"></div><div id="count" class="meta"></div><div id="products" class="products"></div></div></section>';["q","t","n","mw","mh"].forEach(function(id){document.getElementById(id).oninput=filter});filter()}
function filter(){var q=document.getElementById("q").value.toLowerCase(),t=document.getElementById("t").value,n=document.getElementById("n").value,mw=+document.getElementById("mw").value||0,mh=+document.getElementById("mh").value||0,a=P.filter(function(x){return(!q||JSON.stringify(x).toLowerCase().indexOf(q)>=0)&&(!t||x.type===t)&&(!n||x.network.indexOf(n)>=0)&&x.w>=mw&&x.h>=mh});document.getElementById("count").textContent="Showing "+a.length+" of "+P.length+" representative products";document.getElementById("products").innerHTML=a.map(card).join("")||"<p>No matching products.</p>"}
function studio(){app.innerHTML='<section class="section"><div class="wrap"><h2>Design Studio</h2><p>Create a basic sign specification. The working area remains proportional to the quoted dimensions. Artwork download is intentionally unavailable.</p></div></section><section class="studio"><div class="wrap studio-grid"><aside class="panel"><b>Sign & background</b><p>Width (mm)<input id="sw" class="field" type="number" value="180" min="20"></p><p>Height (mm)<input id="sh" class="field" type="number" value="200" min="20"></p><p><button class="btn blue" id="add">+ Add text</button></p><p><label class="btn">Upload your own logo / symbol<input id="upload" type="file" accept="image/*" hidden></label></p><b>Symbol library</b><p class="note">Drag a symbol onto the sign. Click a symbol to add it at the centre. Library artwork is placed behind text by default.</p><div id="symbols" class="symbol-library"></div><b>Pantone background</b><div id="swatches" class="swatches"></div><p class="note">Blue dashed lines are the horizontal and vertical midpoint guides. Drag objects within 6 mm of a midpoint to snap them to it.</p></aside><div class="panel"><b>Working area <span id="read" class="note"></span></b><div class="workspace"><div id="board" class="board"></div></div></div><aside class="panel"><b>Layers & selected object</b><div id="layers" class="layers"></div><p><button class="btn undo-btn" id="undo" type="button">Undo</button><button class="btn danger" id="delete" type="button">Delete selected element</button></p><p class="note">Delete/Backspace removes an element only when you are not actively editing text. Ctrl/Cmd+Z undoes the last Studio change.</p><hr><div id="props" class="note">Select an object to edit it.</div><p><button class="btn blue" id="enquire" type="button">Add design to enquiry</button></p><p class="note">No artwork image or PDF is downloaded.</p></aside></div></section>';init()}

function init(){var SYMBOLS=[{id:"digger-new",name:"Digger arm — NEW",src:"symbols/Digger_Arm_NEW.svg",aspect:1},{id:"digger-old",name:"Digger arm — 2014",src:"symbols/Digger_Arm_2014_K_.svg",aspect:1},{id:"hand-red",name:"No unauthorised hand — red",src:"symbols/No_unauthorised_hand.svg",aspect:1},{id:"hand-small",name:"No unauthorised hand — small",src:"symbols/No_unauthorised_hand_k.svg",aspect:1.015},{id:"plough",name:"Plough",src:"symbols/Plough.svg",aspect:1},{id:"warning",name:"Warning triangle",src:"symbols/Yellow_Triangle_Warning_symbol_exclamation_mark.svg",aspect:1.146}],s={w:180,h:200,bg:["PMS 109 C","#f9d616"],sel:"t1",layers:[{id:"t1",k:"t",text:"DANGER OF DEATH",x:90,y:65,size:28,wt:800},{id:"t2",k:"t",text:"SITE INFORMATION SIGN",x:90,y:140,size:15,wt:700}]},sw=[["PMS 109 C","#f9d616"],["PMS 186 C","#e52b39"],["PMS 300 C","#0076c8"],["PMS 356 C","#00843d"],["PMS 021 C","#fe5000"],["Cool Gray 1 C","#d9d9d6"],["Black C","#2d2926"],["White","#fff"]],history=[],future=[],textEditingId=null,textCheckpointed=false;

function snap(v,m){return Math.abs(v-m)<=6?m:v}
function cloneState(){return JSON.parse(JSON.stringify(s))}
function checkpoint(){history.push(cloneState());if(history.length>50)history.shift();future=[]}
function undo(){if(!history.length)return;future.push(cloneState());var prev=history.pop();s.w=prev.w;s.h=prev.h;s.bg=prev.bg;s.sel=prev.sel;s.layers=prev.layers;draw()}
function syncTextLayer(l){var el=document.querySelector('#board [data-id="'+l.id+'"]');if(el)el.textContent=l.text}
function getSelected(){return s.layers.find(function(x){return x.id===s.sel})}
function addImage(src,name,aspect,x,y){checkpoint();var id="i"+Date.now()+Math.random().toString(16).slice(2),w=Math.min(55,s.w*.38),h=w/(aspect||1);s.layers.push({id:id,k:"i",name:name,src:src,x:x==null?s.w/2:x,y:y==null?s.h/2:y,w:w,h:h,aspect:aspect||1});s.sel=id;draw()}
function deleteSelected(){if(!s.sel)return;checkpoint();s.layers=s.layers.filter(function(l){return l.id!==s.sel});s.sel=s.layers.length?s.layers[s.layers.length-1].id:null;draw()}

document.getElementById("swatches").innerHTML=sw.map(function(a){return '<button class="swatch" data-c="'+a[0]+'" data-h="'+a[1]+'"><div class="dot" style="background:'+a[1]+'"></div>'+a[0]+"</button>"}).join("");
document.querySelectorAll(".swatch").forEach(function(b){b.onclick=function(){checkpoint();s.bg=[b.dataset.c,b.dataset.h];draw()}});
document.getElementById("sw").onchange=function(e){checkpoint();s.w=Math.max(20,+e.target.value||180);draw()};
document.getElementById("sh").onchange=function(e){checkpoint();s.h=Math.max(20,+e.target.value||200);draw()};

document.getElementById("add").onclick=function(){checkpoint();var id="t"+Date.now();s.layers.push({id:id,k:"t",text:"EDITABLE TEXT",x:s.w/2,y:s.h/2,size:18,wt:700});s.sel=id;draw();setTimeout(function(){var ta=document.getElementById("pt");if(ta){ta.focus();ta.select();textEditingId=id;textCheckpointed=false}},0)};

document.getElementById("upload").onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader;r.onload=function(){addImage(r.result,file.name,1,s.w/2,s.h/2)};r.readAsDataURL(file)};

document.getElementById("symbols").innerHTML=SYMBOLS.map(function(a){return '<button class="symbol-item" draggable="true" data-symbol="'+a.id+'"><img src="'+a.src+'" alt=""><span>'+esc(a.name)+'</span></button>'}).join("");
document.querySelectorAll(".symbol-item").forEach(function(el){el.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",el.dataset.symbol);e.dataTransfer.effectAllowed="copy"});el.onclick=function(){var a=SYMBOLS.find(function(x){return x.id===el.dataset.symbol});addImage(a.src,a.name,a.aspect,s.w/2,s.h/2)}});

async function sourceToDataUri(src){if(String(src).indexOf("data:")===0)return src;var r=await fetch(src);if(!r.ok)throw new Error("Could not embed symbol artwork.");var txt=await r.text();return "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(txt)))}
async function buildStudioSvg(){var ordered=s.layers.slice().sort(function(a,b){return(a.k==="t"?1:0)-(b.k==="t"?1:0)}),parts=['<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+s.w+'mm" height="'+s.h+'mm" viewBox="0 0 '+s.w+' '+s.h+'">','<rect x="0" y="0" width="'+s.w+'" height="'+s.h+'" fill="'+s.bg[1]+'"/>'];for(var i=0;i<ordered.length;i++){var l=ordered[i];if(l.k==="t"){var fs=l.size*.3527777778,lines=String(l.text||"").split(/\r?\n/),lh=fs*1.15,start=l.y-((lines.length-1)*lh/2);parts.push('<text x="'+l.x+'" y="'+start+'" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="'+fs+'" font-weight="'+l.wt+'" fill="#000">'+lines.map(function(line,j){return '<tspan x="'+l.x+'" dy="'+(j===0?0:lh)+'">'+svgEsc(line||" ")+'</tspan>'}).join("")+'</text>')}else{var href=await sourceToDataUri(l.src);parts.push('<image href="'+href+'" x="'+(l.x-l.w/2)+'" y="'+(l.y-l.h/2)+'" width="'+l.w+'" height="'+l.h+'" preserveAspectRatio="xMidYMid meet"/>')}}parts.push('</svg>');return parts.join("")}
function svgEsc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;")}
function designSummary(){var lines=["Design Studio enquiry","Sign size: "+s.w+" × "+s.h+" mm","Background: "+s.bg[0]],texts=s.layers.filter(function(l){return l.k==="t"&&String(l.text).trim()}),imgs=s.layers.filter(function(l){return l.k==="i"});if(texts.length){lines.push("Text:");texts.forEach(function(l){lines.push("• "+String(l.text).replace(/\r?\n/g," / "))})}if(imgs.length){lines.push("Symbols / logos:");imgs.forEach(function(l){lines.push("• "+l.name)})}return lines.join("\n")}

document.getElementById("enquire").onclick=async function(){var btn=this;btn.disabled=true;btn.textContent="Preparing design…";try{var svg=await buildStudioSvg();window.markerPlatesPendingDesign={svg:svg,summary:designSummary()};location.hash="#contact"}catch(err){alert("The design could not be prepared for submission. Please try again.");console.error(err)}finally{btn.disabled=false;btn.textContent="Add design to enquiry"}};
var board=document.getElementById("board");
board.addEventListener("dragover",function(e){e.preventDefault();board.classList.add("dropready");e.dataTransfer.dropEffect="copy"});
board.addEventListener("dragleave",function(e){if(!board.contains(e.relatedTarget))board.classList.remove("dropready")});
board.addEventListener("drop",function(e){e.preventDefault();board.classList.remove("dropready");var id=e.dataTransfer.getData("text/plain"),a=SYMBOLS.find(function(x){return x.id===id});if(!a)return;var rect=board.getBoundingClientRect(),scale=rect.width/s.w,x=(e.clientX-rect.left)/scale,y=(e.clientY-rect.top)/scale;addImage(a.src,a.name,a.aspect,Math.max(0,Math.min(s.w,x)),Math.max(0,Math.min(s.h,y)))});

function renderProps(l){
  var el=document.getElementById("props");
  if(!l){el.innerHTML="Select an object to edit it.";return}
  if(l.k==="t"){
    el.innerHTML='Text<textarea id="pt" class="field" rows="5"></textarea>Text size (pt)<input id="ps" class="field" type="number" value="'+l.size+'">Font: Helvetica Neue<br>X (mm)<input id="px" class="field" type="number" value="'+Math.round(l.x)+'">Y (mm)<input id="py" class="field" type="number" value="'+Math.round(l.y)+'">';
    var ta=document.getElementById("pt");
    ta.value=l.text;
    ta.onfocus=function(){textEditingId=l.id;textCheckpointed=false};
    ta.oninput=function(){if(textEditingId!==l.id){textEditingId=l.id;textCheckpointed=false}if(!textCheckpointed){checkpoint();textCheckpointed=true}l.text=ta.value;syncTextLayer(l)};
    ta.onblur=function(){textEditingId=null;textCheckpointed=false};
  }else{
    el.innerHTML='File: '+esc(l.name)+'<br>Width (mm)<input id="iw" class="field" type="number" value="'+Math.round(l.w)+'">Height (mm)<input id="ih" class="field" type="number" value="'+Math.round(l.h)+'">X (mm)<input id="ix" class="field" type="number" value="'+Math.round(l.x)+'">Y (mm)<input id="iy" class="field" type="number" value="'+Math.round(l.y)+'">';
  }
  bindNonText(l)
}

function bindNonText(l){
  var ids=["ps","px","py","iw","ih","ix","iy"];
  ids.forEach(function(id){var e=document.getElementById(id);if(!e)return;
    e.onchange=function(){
      checkpoint();var v=e.value;
      if(id==="ps")l.size=Math.max(4,+v||18);
      else if(id==="px"||id==="ix")l.x=snap(Math.max(0,Math.min(s.w,+v||0)),s.w/2);
      else if(id==="py"||id==="iy")l.y=snap(Math.max(0,Math.min(s.h,+v||0)),s.h/2);
      else if(id==="iw")l.w=Math.max(5,+v||5);
      else if(id==="ih")l.h=Math.max(5,+v||5);
      draw()
    }
  })
}

function draw(){
  var ws=document.querySelector(".workspace"),scale=Math.min((ws.clientWidth-50)/s.w,(ws.clientHeight-50)/s.h),b=document.getElementById("board");
  b.style.width=Math.round(s.w*scale)+"px";b.style.height=Math.round(s.h*scale)+"px";b.style.background=s.bg[1];document.getElementById("read").textContent=s.w+" × "+s.h+" mm";
  b.innerHTML='<div class="gv"></div><div class="gh"></div>';
  var ordered=s.layers.slice().sort(function(a,b){return(a.k==="t"?1:0)-(b.k==="t"?1:0)});
  ordered.forEach(function(l){
    var e=document.createElement("div");e.className="layer "+(l.k==="t"?"textlayer":"imagelayer");e.dataset.id=l.id;e.style.left=l.x*scale+"px";e.style.top=l.y*scale+"px";e.style.zIndex=l.k==="t"?5:2;if(l.id===s.sel)e.classList.add("layer-selected");
    if(l.k==="t"){e.textContent=l.text;e.style.fontSize=l.size*.3528*scale+"px";e.style.fontWeight=l.wt}
    else{e.style.width=l.w*scale+"px";e.style.height=l.h*scale+"px";var im=document.createElement("img");im.src=l.src;im.alt=l.name;im.draggable=false;e.appendChild(im);if(l.id===s.sel){var h=document.createElement("span");h.className="resize-handle";h.onpointerdown=function(ev){startResize(ev,l)};e.appendChild(h)}}
    e.onpointerdown=function(ev){if(ev.target.classList.contains("resize-handle"))return;start(ev)};e.ondblclick=function(){if(l.k==="t"){var ta=document.getElementById("pt");if(ta){ta.focus();ta.select()}}};b.appendChild(e)
  });
  document.getElementById("layers").innerHTML=s.layers.map(function(l){return '<div class="'+(l.id===s.sel?"sel":"")+'" data-id="'+l.id+'">'+esc(l.k==="t"?l.text:l.name)+"</div>"}).join("")||'<div class="note">No elements. Drag a symbol onto the sign or add text.</div>';
  document.querySelectorAll("#layers [data-id]").forEach(function(el){el.onclick=function(){s.sel=el.dataset.id;draw()}});
  renderProps(getSelected())
